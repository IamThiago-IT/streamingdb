services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: streamingdb-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamingdb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamingdb_password}
      POSTGRES_DB: ${POSTGRES_DB:-streamingdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamingdb_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamingdb-network

  # Aplicação Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamingdb-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-streamingdb_user}:${POSTGRES_PASSWORD:-streamingdb_password}@db:5432/${POSTGRES_DB:-streamingdb}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Defina BETTER_AUTH_SECRET no .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    networks:
      - streamingdb-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  streamingdb-network:
    driver: bridge
